paragraphs:
  - Hi, I’m Khondker Tamzidur Rahman, an undergraduate Computer Science and Engineering student at North South University, driven by a passion for technology, artificial intelligence, web development, photography, cinematography, and visual storytelling.
My creative journey took a meaningful turn in January 2025 when I founded Snapshot Stories, driven purely by passion and a genuine love for creating content. What started as a simple creative pursuit soon became a journey of learning, responsibility, teamwork, and continuous growth. My very first project opened the door to opportunities I had never imagined.
Since then, I’ve had the privilege of working with a diverse range of renowned organizations, brands, and communities, including BMW Bangladesh, Satori, Persona, Kikkoman Bangladesh, Embassy of Saudi Arabia, Khao San BD, Takumi Japanese Restaurant, Coastal Ultra Bangladesh, KHAR, YAMAAN, The Policy Research Institute (PRI), P2A, Roman Sacrifice, ASUS, 09 Fragrance, and various clubs and organizations at North South University, among many others. From corporate productions and brand campaigns to high-energy events, including marathons, each project has brought new experiences and opportunities to grow.
Beyond visual production, I’ve also collaborated with influencers, brands, and communities to strengthen their digital presence through creative storytelling, content production, and social media marketing. Seeing our work reach wider audiences and generate millions of views across social platforms has been one of the most rewarding parts of this journey.
Every project has pushed me to think differently, embrace new challenges, and raise my creative standards. I believe in learning through experience, exploring new possibilities, and turning ideas into meaningful work. As I move forward, I look forward to discovering more, building new connections, and growing across both the creative and technological worlds.

  
blockquote: Driven by curiosity and a passion for continuous growth, I actively explore emerging tools, technologies and creative methodologies to refine my skills, enhance my workflow, and consistently elevate the quality of my work.
