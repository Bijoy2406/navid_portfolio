
paragraphs:
  - >-
   Hi, I’m Khondker Tamzidur Rahman, an undergraduate Computer Science and Engineering student at North South University, passionate about technology, artificial intelligence, web development, photography, cinematography, and visual storytelling.
  - >-
   My creative journey took a meaningful turn in January 2025 when I founded Snapshot Stories, driven by a genuine passion for creating. What began as a simple creative pursuit quickly evolved into a journey of learning, responsibility, teamwork, and growth. My first project opened doors to opportunities I had never imagined.

  - >-
    Since then, I’ve had the privilege of working with renowned organizations, brands, and communities, including BMW Bangladesh, Satori, Persona, Kikkoman Bangladesh, Embassy of Saudi Arabia, Khao San BD, Takumi Japanese Restaurant, Coastal Ultra Bangladesh, KHAR, YAMAAN, PRI, P2A, Roman Sacrifice, ASUS, 09 Fragrance, and various organizations at North South University. From corporate productions and brand campaigns to high-energy events and marathons, every project has brought new experiences and opportunities. Beyond visual production, I’ve collaborated with influencers, brands, and communities to strengthen their digital presence through creative storytelling, content production, and social media marketing. Seeing our work reach wider audiences and generate millions of views across social platforms has been especially rewarding.

  - >-
    Every project inspires me to explore new ideas, embrace challenges, and raise my creative standards. I believe in learning through experience and turning ideas into meaningful work. Looking ahead, I’m excited to build new connections and continue growing across both the creative and technological worlds.
  

blockquote: >-
  Driven by curiosity and a passion for continuous growth, I actively explore emerging tools, technologies and creative methodologies to refine my skills, enhance my workflow, and consistently elevate the quality of my work.
